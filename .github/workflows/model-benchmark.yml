name: ScamShield model benchmark

on:
  push:
    branches:
      - v1-1-model-improvement
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Tests
        run: bun run test

      - name: Generate Convex types
        run: bunx convex codegen --typecheck disable

      - name: App typecheck
        run: bun tsc -b --noEmit

      - name: Test typecheck
        run: bun run typecheck:tests

      - name: Production build
        run: bun run build

      - name: External model benchmark
        run: bun run research:model:benchmark
