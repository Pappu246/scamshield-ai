name: ScamShield model benchmark

on:
  push:
    branches:
      - v1-1-model-improvement
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Production regression tests
        run: bun run test

      - name: Analyzer test typecheck
        run: bun run typecheck:tests

      - name: External model benchmark
        run: bun run research:model:benchmark

      - name: External-trained candidate benchmark
        run: bun research/external-train-candidate.ts

      - name: Seed oversampling sweep
        run: bun research/seed-oversampling-sweep.ts

      - name: Seed error audit
        run: bun research/seed-error-audit.ts

      - name: Factor-32 threshold sweep
        run: bun research/factor32-threshold-sweep.ts

      - name: Upload v1.1 candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: scamshield-v1-1-model
          path: /tmp/scamshield-v11-candidate-model.json
          if-no-files-found: error

      - name: Download UCI SMS benchmark
        run: |
          curl -L --fail --retry 5 --retry-delay 2 \
            https://archive.ics.uci.edu/ml/machine-learning-databases/00228/smsspamcollection.zip \
            -o /tmp/smsspamcollection.zip
          unzip -p /tmp/smsspamcollection.zip SMSSpamCollection > /tmp/SMSSpamCollection
          test "$(wc -l < /tmp/SMSSpamCollection)" -eq 5574

      - name: Independent external benchmark
        run: bun research/secondary-external-benchmark.ts
