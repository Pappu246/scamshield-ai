name: ScamShield security verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: scamshield-security-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Regression and security tests
        run: bun run test

      - name: Source secret regression check
        run: |
          ! grep -R --line-number --fixed-strings "fb_email_" src .env.example
